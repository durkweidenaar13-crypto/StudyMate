quiz(){const{o,qs,i,res}=Q;if(i>=qs.length)return VW.qend();const r=qs[i],d=res[i],fb=d&&!o.exam,b=(x,k,c)=>`<button class="btn opt ${c||''}" ${d?'disabled':''} onclick="ans(${k})">${E(x)}</button>`;
